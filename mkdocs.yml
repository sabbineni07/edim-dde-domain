# EDIM DDE engineer guide — local Docker / laptop (MkDocs Material)
# Build: from edim-dde-domain → make -C ../edim-dde-api guide-site
#        or: ./deploy/scripts/build_guide_site.sh (from edim-dde-api)
#
# Served at http://127.0.0.1:8080/guide/ (not deployed to Databricks Apps)

site_name: EDIM DDE Engineer Guide
site_description: Platform engineers, agent authors, and API operators
# Relative asset/nav links (served under FastAPI at /guide/)
use_directory_urls: true

docs_dir: docs
site_dir: site  # overridden by build script → edim-dde-api/deploy/docker/guide-site

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra:
  generator: false

