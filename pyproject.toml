[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edim-dde-domain"
version = "1.0.0"
description = "EDIM domain agents + tools (YAML graphs on edim-dde-ai)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "PyYAML>=6",
]

[project.optional-dependencies]
databricks = ["databricks-sql-connector>=3.0"]
azure = ["azure-identity>=1.15"]
keyvault = ["azure-identity>=1.15", "azure-keyvault-secrets>=4.8"]
llm = ["openai>=1.40", "azure-identity>=1.15"]
dev = [
  "pytest>=8",
  "jsonschema>=4.0",
  "databricks-sql-connector>=3.0",
  "azure-identity>=1.15",
  "azure-keyvault-secrets>=4.8",
  "openai>=1.40",
]
[tool.hatch.build.targets.wheel]
packages = ["src/edim_dde_domain"]
# Include agent YAML + prompt/content assets (not only .py). Do not also
# force-include the same paths — hatchling rejects duplicate archive members.
include = [
  "edim_dde_domain/**/*.py",
  "edim_dde_domain/**/*.yaml",
  "edim_dde_domain/**/*.yml",
  "edim_dde_domain/**/*.md",
  "edim_dde_domain/**/*.json",
  "edim_dde_domain/**/*.txt",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
