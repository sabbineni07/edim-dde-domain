[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edim-dde-domain"
version = "1.0.0"
description = "EDIM domain agents + tools (YAML graphs on edim-dde-ai)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "PyYAML>=6",
]

[project.optional-dependencies]
databricks = ["databricks-sql-connector>=3.0"]
azure = ["azure-identity>=1.15"]
keyvault = ["azure-identity>=1.15", "azure-keyvault-secrets>=4.8"]
llm = ["openai>=1.40", "azure-identity>=1.15"]
dev = [
  "pytest>=8",
  "jsonschema>=4.0",
  "databricks-sql-connector>=3.0",
  "azure-identity>=1.15",
  "azure-keyvault-secrets>=4.8",
  "openai>=1.40",
]
[tool.hatch.build.targets.wheel]
packages = ["src/edim_dde_domain"]

[tool.hatch.build.targets.wheel.force-include]
"src/edim_dde_domain/config/sources.yaml" = "edim_dde_domain/config/sources.yaml"
"src/edim_dde_domain/agents/cluster_tuning/content" = "edim_dde_domain/agents/cluster_tuning/content"
"src/edim_dde_domain/agents/spark_rca/content" = "edim_dde_domain/agents/spark_rca/content"
"src/edim_dde_domain/agents/cluster_tuning/cluster_tuning.agent.yaml" = "edim_dde_domain/agents/cluster_tuning/cluster_tuning.agent.yaml"
"src/edim_dde_domain/agents/spark_rca/spark_rca.agent.yaml" = "edim_dde_domain/agents/spark_rca/spark_rca.agent.yaml"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
