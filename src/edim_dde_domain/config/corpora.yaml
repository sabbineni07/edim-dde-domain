corpora:
  spark-runbooks:
    description: >
      Spark RCA runbooks and playbooks for similarity search / RAG grounding.
      Deployed default backend is Azure AI Search (EDIM_RETRIEVAL=azure_ai_search);
      local uses FAISS under EDIM_FAISS_INDEX_PATH (local dir or Databricks Volume).
    # provider: null  → use process EDIM_RETRIEVAL default
    azure_index: spark-runbooks
    # Optional FAISS path override (else EDIM_FAISS_INDEX_PATH):
    # index_path: ${EDIM_FAISS_INDEX_PATH}
    # Databricks Vector Search override example:
    # provider: databricks_vector
    # databricks_index: catalog.schema.spark_runbooks_vs

  spark-rca-outcomes:
    description: >
      Derived failure-feature / diagnosis / action cards from persisted spark_rca
      lifecycle records. Retrieved by evidence-feature similarity across jobs;
      job_id and job_run_id remain metadata for exact entity-history views.
    azure_index: spark-rca-outcomes

  cluster-tuning-guidance:
    description: >
      Cluster sizing / rightsizing playbooks for cluster_tuning historical_context
      via rag.retrieve. Complements RecommendationStore (structured past proposals)
      and cluster-tuning-outcomes (feature similarity over past actions).
    azure_index: cluster-tuning-guidance

  cluster-tuning-outcomes:
    description: >
      Derived experience cards from RecommendationStore writes (configured
      resource-pressure features + actions). Indexed automatically when
      recommendations are saved/status-updated;
      retrieved by feature similarity for cluster_tuning sizing (not by job_id).
      job_id remains in metadata for entity/chat filters.
    azure_index: cluster-tuning-outcomes
