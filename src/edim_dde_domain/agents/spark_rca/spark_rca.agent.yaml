agent_id: spark_rca
display_name: Spark Job RCA
version: 1
entry:
  method: invoke
  sync: true

content_dir: ./content

# RAG / retrieval policy (BL-021 pilot). Backend selected via EDIM_RETRIEVAL;
# corpus metadata lives in domain config/corpora.yaml.
rag:
  enabled: true
  corpus: spark-runbooks
  top_k: 5
  search_mode: hybrid
  cite: true

graph:
  nodes:
    - id: collect_failure_anchors
      type: domain.sql.query
      source: edim_sql_wh
      skip_if_key: evidence_pack
      output_key: failure_anchors
      result_mode: rows
      params_from_state: [job_run_id, job_run_date, task_key]
      query: |
        SELECT
          CAST(event_id AS STRING) AS event_id,
          CAST(event_ts AS STRING) AS event_ts,
          event_type,
          CAST(job_id AS STRING) AS job_id,
          CAST(job_run_id AS STRING) AS job_run_id,
          CAST(job_run_date AS STRING) AS job_run_date,
          CAST(task_key AS STRING) AS task_key,
          CAST(spark_app_id AS STRING) AS spark_app_id,
          status,
          successful,
          failure_reason,
          CAST(attributes AS STRING) AS attributes
        FROM ${DATABRICKS_SPARK_METRICS_TABLE}
        WHERE CAST(job_run_id AS STRING) = :job_run_id
          AND event_type = 'pipeline_end'
          AND (successful = false OR lower(CAST(status AS STRING)) IN ('failure', 'failed', 'error'))
          AND (:job_run_date IS NULL OR job_run_date = CAST(:job_run_date AS DATE))
          AND (:task_key IS NULL OR CAST(task_key AS STRING) = :task_key)
        ORDER BY event_ts DESC
        LIMIT 20

    - id: collect_sql_plans
      type: domain.sql.query
      source: edim_sql_wh
      skip_if_key: evidence_pack
      output_key: sql_plans
      result_mode: rows
      params_from_state: [job_run_id, job_run_date, task_key]
      query: |
        SELECT
          CAST(event_id AS STRING) AS event_id,
          CAST(event_ts AS STRING) AS event_ts,
          event_type,
          CAST(job_id AS STRING) AS job_id,
          CAST(job_run_id AS STRING) AS job_run_id,
          CAST(job_run_date AS STRING) AS job_run_date,
          CAST(task_key AS STRING) AS task_key,
          CAST(spark_app_id AS STRING) AS spark_app_id,
          status,
          successful,
          failure_reason,
          CAST(attributes AS STRING) AS attributes
        FROM ${DATABRICKS_SPARK_METRICS_TABLE}
        WHERE CAST(job_run_id AS STRING) = :job_run_id
          AND event_type IN ('spark_sql_query_error', 'spark_sql_query_observed')
          AND (:job_run_date IS NULL OR job_run_date = CAST(:job_run_date AS DATE))
          AND (:task_key IS NULL OR CAST(task_key AS STRING) = :task_key)
        ORDER BY
          CASE WHEN event_type = 'spark_sql_query_error' THEN 0 ELSE 1 END,
          event_ts DESC
        LIMIT 40

    - id: collect_error_logs
      type: domain.sql.query
      source: edim_sql_wh
      skip_if_key: evidence_pack
      output_key: error_logs
      result_mode: rows
      params_from_state: [job_run_id, job_run_date, task_key]
      query: |
        SELECT
          CAST(log_timestamp AS STRING) AS log_timestamp,
          log_level,
          logger_name,
          message,
          exception,
          CAST(job_id AS STRING) AS job_id,
          CAST(job_run_id AS STRING) AS job_run_id,
          CAST(job_run_date AS STRING) AS job_run_date,
          CAST(task_key AS STRING) AS task_key,
          CAST(spark_app_id AS STRING) AS spark_app_id
        FROM ${DATABRICKS_SPARK_LOGS_TABLE}
        WHERE CAST(job_run_id AS STRING) = :job_run_id
          AND (upper(log_level) IN ('ERROR', 'WARNING') OR exception IS NOT NULL)
          AND (:job_run_date IS NULL OR job_run_date = CAST(:job_run_date AS DATE))
          AND (:task_key IS NULL OR CAST(task_key AS STRING) = :task_key)
        ORDER BY log_timestamp DESC
        LIMIT 100

    - id: collect_timeline
      type: domain.sql.query
      source: edim_sql_wh
      skip_if_key: evidence_pack
      output_key: timeline_events
      result_mode: rows
      params_from_state: [job_run_id, job_run_date, task_key]
      query: |
        SELECT
          CAST(event_id AS STRING) AS event_id,
          CAST(event_ts AS STRING) AS event_ts,
          event_type,
          CAST(task_key AS STRING) AS task_key,
          status,
          successful,
          failure_reason,
          CAST(attributes AS STRING) AS attributes
        FROM ${DATABRICKS_SPARK_METRICS_TABLE}
        WHERE CAST(job_run_id AS STRING) = :job_run_id
          AND event_type IN (
            'pipeline_start', 'pipeline_end',
            'spark_sql_query_observed', 'spark_sql_query_error',
            'spark_job_start', 'spark_job_completed',
            'spark_stage_start', 'spark_stage_completed'
          )
          AND (:job_run_date IS NULL OR job_run_date = CAST(:job_run_date AS DATE))
          AND (:task_key IS NULL OR CAST(task_key AS STRING) = :task_key)
        ORDER BY event_ts ASC
        LIMIT 80

    - id: collect_stage_pressure
      type: domain.sql.query
      source: edim_sql_wh
      skip_if_key: evidence_pack
      output_key: stage_pressure
      result_mode: rows
      params_from_state: [job_run_id, job_run_date, task_key]
      query: |
        SELECT
          CAST(event_id AS STRING) AS event_id,
          CAST(event_ts AS STRING) AS event_ts,
          event_type,
          CAST(task_key AS STRING) AS task_key,
          status,
          successful,
          failure_reason,
          CAST(attributes AS STRING) AS attributes
        FROM ${DATABRICKS_SPARK_METRICS_TABLE}
        WHERE CAST(job_run_id AS STRING) = :job_run_id
          AND event_type IN (
            'spark_job_completed', 'spark_stage_completed', 'spark_stage_task_summary'
          )
          AND (:job_run_date IS NULL OR job_run_date = CAST(:job_run_date AS DATE))
          AND (:task_key IS NULL OR CAST(task_key AS STRING) = :task_key)
        ORDER BY event_ts DESC
        LIMIT 100

    - id: assemble_evidence
      type: domain.rca.assemble_evidence
    - id: rule_classify
      type: domain.rca.classify_failure
      # Broad category seeds only; diagnosis remains evidence-first in the LLM.
      # Ordered groups and patterns are agent policy, not hard-coded Python.
      signal_groups:
        - category: sql_error
          confidence: 0.55
          rationale: SQL analysis, parse, or resolution signal matched telemetry.
          patterns:
            - 'AnalysisException|ParseException'
            - 'table(?:\s+or\s+view)?\s+not\s+found|cannot\s+resolve|UNRESOLVED_'
            - 'SparkSQL|SYNTAX_ERROR'
        - category: data_quality
          confidence: 0.60
          rationale: Schema, constraint, type, or data-quality signal matched telemetry.
          patterns:
            - 'null\s+constraint|ConstraintViolation|NOT\s+NULL'
            - 'schema\s+mismatch|type\s+mismatch|DELTA_SCHEMA'
            - 'data\s+quality'
        - category: resource
          confidence: 0.70
          rationale: Explicit runtime resource or executor-loss signal matched telemetry.
          patterns:
            - 'OutOfMemory|OOM|Java heap space|MemoryError'
            - 'No space left|disk\s+full'
            - 'ExecutorLost|Lost executor|Container killed'
        - category: skew_shuffle
          confidence: 0.55
          rationale: Shuffle, fetch-failure, or skew signal matched telemetry.
          patterns:
            - 'skew'
            - 'shuffle.*(?:fail|error)|FetchFailed'
        - category: timeout_or_cancel
          confidence: 0.65
          rationale: Timeout, cancellation, or explicit termination signal matched telemetry.
          patterns:
            - 'timeout|timed\s+out|deadline exceeded'
            - 'cancelled|canceled|killed by user'
        - category: config
          confidence: 0.60
          rationale: Access, credential, connection, or configuration signal matched telemetry.
          patterns:
            - 'permission\s+denied|Unauthorized|AccessDenied|Forbidden'
            - 'secret|credential|authentication|authorization'
            - 'SparkConnect|configuration|ConfigException'
    - id: build_retrieval_query
      type: domain.rca.build_retrieval_query
    - id: load_historical_context
      type: domain.rca.load_historical_context
      enabled: true
      corpus: spark-rca-outcomes
      top_k: 5
      same_job_limit: 3
      # Measurable attrs → signal_* labels (tuning resource_pressure analogue).
      # Add a signal with attr_keys/min/label — no Python branch required.
      failure_signals:
        max_exception_labels: 3
        max_plan_ops: 5
        max_msg_tokens: 4
        include_hint_category_label: true
        signals:
          failed_tasks:
            attr_keys: [num_failed_tasks, numFailedTasks]
            min: 1
            label: signal_failed_tasks
          spill_bytes:
            attr_keys:
              - memoryBytesSpilled
              - memory_bytes_spilled
              - diskBytesSpilled
              - disk_bytes_spilled
            min: 1
            label: signal_spill_bytes
          shuffle_bytes:
            attr_keys:
              - shuffle_read_bytes
              - shuffleReadBytes
              - shuffle_write_bytes
              - shuffleWriteBytes
            min: 1
            label: signal_shuffle_bytes
    - id: build_web_search_query
      type: domain.rca.build_web_search_query
      # Online enrichment is opt-in. It never receives raw logs, SQL, paths,
      # table names, job identifiers, or arbitrary user text.
      enabled: false
      trigger: low_confidence_or_unknown
      confidence_below: 0.55
    - id: search_public_web
      type: web.search
      # Execution is gated by build_web_search_query.enabled above: blank query
      # means this node performs no provider call.
      enabled: true
      query_key: web_search_query
      output_key: web_search_hits
      context_key: web_search_context
      top_k: 3
      allowed_domains:
        - docs.databricks.com
        - kb.databricks.com
        - spark.apache.org
        - learn.microsoft.com
    - id: retrieve_runbooks
      type: rag.retrieve
      corpus: spark-runbooks
      top_k: 5
      search_mode: hybrid
      query_key: retrieval_query
      output_key: runbook_hits
      context_key: runbook_context
    - id: prepare_llm_payload
      type: domain.rca.prepare_llm_payload
    - id: synthesize
      type: llm_chain
      chain: rca
      output_key: llm_raw
      attach_skills: true
    - id: parse_llm_json
      type: domain.rca.parse_llm_json
    - id: validate_output
      type: domain.rca.validate_output
    - id: evaluate_output
      type: domain.rca.evaluate_output

  edges:
    - [START, collect_failure_anchors]
    - [collect_failure_anchors, collect_sql_plans]
    - [collect_sql_plans, collect_error_logs]
    - [collect_error_logs, collect_timeline]
    - [collect_timeline, collect_stage_pressure]
    - [collect_stage_pressure, assemble_evidence]
    - [assemble_evidence, rule_classify]
    - [rule_classify, build_retrieval_query]
    - [build_retrieval_query, load_historical_context]
    - [load_historical_context, build_web_search_query]
    - [build_web_search_query, search_public_web]
    - [search_public_web, retrieve_runbooks]
    - [retrieve_runbooks, prepare_llm_payload]
    - [prepare_llm_payload, synthesize]
    - [synthesize, parse_llm_json]
    - [parse_llm_json, validate_output]
    - [validate_output, evaluate_output]
    - [evaluate_output, END]
