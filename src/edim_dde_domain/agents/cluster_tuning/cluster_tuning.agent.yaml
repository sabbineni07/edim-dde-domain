agent_id: cluster_tuning
display_name: DBX Cluster Tuning
version: 1
entry:
  method: invoke
  sync: true

content_dir: ./content

# Optional infra bindings (omit → process .env / Key Vault globals).
# Demo / reference: vars below already exist in edim-dde-domain/.env.
# Uncomment to bind this agent explicitly (same targets as process defaults).
# Phase 1 wires bindings.llm (endpoint/deployment + sampling knobs);
# search / cosmos / sql-warehouse are shape-validated (runtime injection later).
# Never put API keys or secrets in YAML. Non-secret URLs/names may be literals
# (e.g. endpoint: https://….openai.azure.com/openai/v1) or ${ENV:…};
# temperature / top_p / top_k / max_tokens are always literal numbers.
# bindings:
#   llm:
#     endpoint: ${ENV:AZURE_OPENAI_ENDPOINT}
#     deployment: ${ENV:AZURE_OPENAI_DEPLOYMENT_NAME}
#     temperature: 0.0
#     top_p: 1.0
#     top_k: 40
#     max_tokens: 4096
#   search:
#     endpoint: ${ENV:EDIM_AZURE_SEARCH_ENDPOINT}
#     index: ${ENV:EDIM_AZURE_SEARCH_INDEX}
#   cosmos:
#     endpoint: ${ENV:EDIM_COSMOS_ENDPOINT}
#     database: ${ENV:EDIM_COSMOS_DATABASE}
#   sql-warehouse:
#     host: ${ENV:DATABRICKS_HOST}
#     http_path: ${ENV:DATABRICKS_HTTP_PATH}

# Optional RAG corpus for sizing guidance (EDIM_RETRIEVAL=none → empty hits; still OK)
rag:
  corpus: cluster-tuning-guidance

graph:
  nodes:
    - id: collect_metrics
      type: domain.sql.query
      source: edim_sql_wh
      result_mode: first_row
      output_key: metrics
      on_empty: error
      params_from_state: [job_id, cluster_id, job_run_id, start_date, end_date]
      query: |
        SELECT
          CAST(job_run_date AS STRING) AS job_run_date,
          CAST(workspace_id AS STRING) AS workspace_id,
          workspace_name,
          CAST(job_id AS STRING) AS job_id,
          CAST(job_run_id AS STRING) AS job_run_id,
          CAST(cluster_id AS STRING) AS cluster_id,
          job_type,
          job_name,
          dbr_version,
          CAST(job_run_start_time_utc AS STRING) AS job_run_start_time_utc,
          CAST(job_run_end_time_utc AS STRING) AS job_run_end_time_utc,
          COALESCE(CAST(job_run_duration_seconds AS DOUBLE), 0.0) AS job_run_duration_seconds,
          azure_driver_vm_size,
          COALESCE(CAST(driver_node_count AS BIGINT), 1) AS driver_node_count,
          CAST(driver_vcpus_consumed AS DOUBLE) AS driver_vcpus_consumed,
          CAST(driver_memory_gb_consumed AS DOUBLE) AS driver_memory_gb_consumed,
          COALESCE(CAST(avg_driver_cpu_utilization_pct AS DOUBLE), 0.0) AS avg_driver_cpu_utilization_pct,
          COALESCE(CAST(avg_driver_memory_utilization_pct AS DOUBLE), 0.0) AS avg_driver_memory_utilization_pct,
          COALESCE(CAST(peak_driver_cpu_utilization_pct AS DOUBLE), 0.0) AS peak_driver_cpu_utilization_pct,
          COALESCE(azure_worker_vm_size, 'Standard_E8s_v3') AS azure_worker_vm_size,
          COALESCE(CAST(max_worker_nodes_provisioned AS BIGINT), 1) AS max_worker_nodes_provisioned,
          CAST(total_worker_vcpus_provisioned AS DOUBLE) AS total_worker_vcpus_provisioned,
          CAST(total_worker_memory_gb_provisioned AS DOUBLE) AS total_worker_memory_gb_provisioned,
          COALESCE(CAST(avg_worker_nodes_consumed AS DOUBLE), 0.0) AS avg_worker_nodes_consumed,
          COALESCE(CAST(p99_worker_nodes_consumed AS DOUBLE), 0.0) AS p99_worker_nodes_consumed,
          CAST(avg_worker_vcpus_consumed AS DOUBLE) AS avg_worker_vcpus_consumed,
          CAST(avg_worker_memory_gb_consumed AS DOUBLE) AS avg_worker_memory_gb_consumed,
          CAST(avg_worker_vcpus_utilized AS DOUBLE) AS avg_worker_vcpus_utilized,
          CAST(avg_worker_memory_gb_utilized AS DOUBLE) AS avg_worker_memory_gb_utilized,
          COALESCE(CAST(avg_worker_cpu_utilization_pct AS DOUBLE), 0.0) AS avg_worker_cpu_utilization_pct,
          COALESCE(CAST(avg_worker_memory_utilization_pct AS DOUBLE), 0.0) AS avg_worker_memory_utilization_pct,
          COALESCE(CAST(peak_worker_cpu_utilization_pct AS DOUBLE), 0.0) AS peak_worker_cpu_utilization_pct,
          COALESCE(CAST(peak_worker_memory_utilization_pct AS DOUBLE), 0.0) AS peak_worker_memory_utilization_pct,
          CAST(worker_node_provisioning_efficiency_pct AS DOUBLE) AS worker_node_provisioning_efficiency_pct,
          CAST(worker_cpu_utilization_efficiency_pct AS DOUBLE) AS worker_cpu_utilization_efficiency_pct,
          CAST(worker_memory_utilization_efficiency_pct AS DOUBLE) AS worker_memory_utilization_efficiency_pct,
          CAST(processed_bytes AS BIGINT) AS processed_bytes,
          CAST(processed_row_count AS BIGINT) AS processed_row_count
        FROM ${DATABRICKS_JOB_CLUSTER_METRICS_TABLE}
        WHERE CAST(job_id AS STRING) = :job_id
          AND (:cluster_id IS NULL OR CAST(cluster_id AS STRING) = :cluster_id)
          AND (:job_run_id IS NULL OR CAST(job_run_id AS STRING) = :job_run_id)
          AND (:start_date IS NULL OR job_run_date >= CAST(:start_date AS DATE))
          AND (:end_date IS NULL OR job_run_date <= CAST(:end_date AS DATE))
        ORDER BY job_run_date DESC
        LIMIT 1
    - id: normalize_metrics
      type: domain.tuning.normalize_metrics
    - id: build_retrieval_query
      type: domain.tuning.build_retrieval_query
    - id: retrieve_guidance
      type: rag.retrieve
      corpus: cluster-tuning-guidance
      query_key: retrieval_query
      top_k: 4
      output_key: guidance_hits
      context_key: guidance_context
    - id: prepare_sizing_payload
      type: domain.tuning.prepare_sizing_payload
      # RecommendationStore: same job_id shelf; heuristic similar = cold-start fallback
      history_job_top_n: 5
      history_similar_top_n: 5
      history_candidate_limit: 80
      history_prefer_statuses: [applied, accepted, proposed]
      # Experience index (feature similarity over past outcomes)
      history_experience_top_k: 5
      history_experience_corpus: cluster-tuning-outcomes
      history_heuristic_fallback: true
      # Resource dimensions and thresholds are data, not scenario branches.
      # Add another dimension with metric_keys (or a numerator/denominator ratio)
      # without changing the pressure engine.
      resource_pressure:
        target_utilization_pct: 90
        capacity_buffer_pct: 10
        shape_change_min_level: high
        dimensions:
          cpu:
            role: resource
            metric_keys:
              - peak_worker_cpu_utilization_pct
              - peak_driver_cpu_utilization_pct
            thresholds: {low_below: 40, high_at: 70, saturated_at: 85}
            preferred_families: [F, D]
          memory:
            role: resource
            metric_keys:
              - peak_worker_memory_utilization_pct
              - peak_driver_memory_utilization_pct
              - avg_driver_memory_utilization_pct
            thresholds: {low_below: 40, high_at: 70, saturated_at: 90}
            preferred_families: [E]
          worker_capacity:
            role: capacity
            ratio:
              numerator_key: avg_worker_nodes_consumed
              denominator_key: max_worker_nodes_provisioned
              scale: 100
            thresholds: {low_below: 40, high_at: 70, saturated_at: 90}
            preferred_families: []
    - id: run_sizing
      type: llm_chain
      chain: sizing
      output_key: sizing_raw
      attach_skills: true
    - id: parse_sizing
      type: domain.tuning.parse_sizing
    - id: validate_performance
      type: domain.tuning.validate_performance
    - id: assess_risks
      type: domain.tuning.assess_risks
    - id: generate_recommendation
      type: domain.tuning.generate_recommendation
    - id: prepare_explanation_payload
      type: domain.tuning.prepare_explanation_payload
    - id: generate_explanation
      type: llm_chain
      chain: explanation
      output_key: explanation
      attach_skills: false
  edges:
    - [START, collect_metrics]
    - [collect_metrics, normalize_metrics]
    - [normalize_metrics, build_retrieval_query]
    - [build_retrieval_query, retrieve_guidance]
    - [retrieve_guidance, prepare_sizing_payload]
    - [prepare_sizing_payload, run_sizing]
    - [run_sizing, parse_sizing]
    - [validate_performance, assess_risks]
    - [assess_risks, generate_recommendation]
    - [prepare_explanation_payload, generate_explanation]
    - [generate_explanation, END]
  routes:
    # Re-prompt sizing when retryable guardrail clamps remain (max 2 attempts).
    # Skip retrieve on retry — historical_context already on state.
    - after: parse_sizing
      when:
        field: sizing_needs_retry
        op: truthy
      then: prepare_sizing_payload
      else: validate_performance
    - after: generate_recommendation
      when:
        field: include_explanation
        op: truthy
      then: prepare_explanation_payload
      else: END
