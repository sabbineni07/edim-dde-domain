<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="EDIM DDE R1 system context">
  <defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="55%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#FF3621"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
    <style>
      .bg { fill: #F7F9FC; }
      .title { font: 700 28px 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0A1628; }
      .sub { font: 400 13px 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5C6B7A; }
      .h { font: 700 14px 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0A1628; }
      .b { font: 400 12px 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #334155; }
      .t { font: 600 10px 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0078D4; }
      .lbl { font: 600 11px 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #64748B; }
      .foot { font: 400 11px 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5C6B7A; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="6" fill="url(#topbar)"/>
  <text x="48" y="48" class="title">EDIM DDE R1 - System context</text>
  <text x="48" y="70" class="sub">Clients - FastAPI - YAML/LangGraph - Databricks / Azure AI Foundry / LangSmith / Key Vault</text>

  <g filter="url(#shadow)">
    <rect x="48" y="110" width="210" height="150" rx="12" fill="#fff" stroke="#D5DEE8"/>
    <rect x="48" y="110" width="6" height="150" rx="3" fill="#0078D4"/>
    <text x="70" y="138" class="h">Clients</text>
    <text x="70" y="164" class="b">- curl / Postman</text>
    <text x="70" y="184" class="b">- Apps (+ Swagger /docs)</text>
    <text x="70" y="204" class="b">- Future Angular UI</text>
    <text x="70" y="236" class="t">HTTPS / JSON</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="100" width="250" height="170" rx="12" fill="#fff" stroke="#D5DEE8"/>
    <rect x="330" y="100" width="6" height="170" rx="3" fill="#0D9488"/>
    <text x="352" y="128" class="h">edim-dde-api - FastAPI</text>
    <text x="352" y="154" class="b">- CORS + Apps user-token MW</text>
    <text x="352" y="174" class="b">- KV bootstrap (App SP = A)</text>
    <text x="352" y="194" class="b">- /health + /api/v1/*</text>
    <text x="352" y="214" class="b">- request_id correlation</text>
    <text x="352" y="246" class="t">edim-dde-api-*</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="100" width="270" height="170" rx="12" fill="#fff" stroke="#D5DEE8"/>
    <rect x="650" y="100" width="6" height="170" rx="3" fill="#334155"/>
    <text x="672" y="128" class="h">edim-dde-ai - LangGraph</text>
    <text x="672" y="154" class="b">- YAML agents + registries</text>
    <text x="672" y="174" class="b">- llm_chain + invoke_agent</text>
    <text x="672" y="194" class="b">- Content hub (prompts)</text>
    <text x="672" y="214" class="b">- LangSmith run tags</text>
    <text x="672" y="246" class="t">LangChain / LangGraph</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="980" y="110" width="252" height="150" rx="12" fill="#fff" stroke="#D5DEE8"/>
    <rect x="980" y="110" width="6" height="150" rx="3" fill="#B45309"/>
    <text x="1002" y="138" class="h">Azure Key Vault</text>
    <text x="1002" y="164" class="b">- loads EDIM_FOUNDRY_* (B)</text>
    <text x="1002" y="184" class="b">- map ENV:vaultSecret</text>
    <text x="1002" y="204" class="b">- opened by App SP (A)</text>
    <text x="1002" y="236" class="t">Secrets boundary</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="340" width="250" height="170" rx="12" fill="#fff" stroke="#D5DEE8"/>
    <rect x="330" y="340" width="6" height="170" rx="3" fill="#FF3621"/>
    <text x="352" y="368" class="h">edim-dde-domain</text>
    <text x="352" y="394" class="b">- sources.yaml + SQL auth</text>
    <text x="352" y="414" class="b">- cluster_tuning + spark_rca</text>
    <text x="352" y="434" class="b">- Foundry LLM adapter</text>
    <text x="352" y="454" class="b">- Expandable PII patterns</text>
    <text x="352" y="486" class="t">Platform + product agents</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="48" y="360" width="210" height="150" rx="12" fill="#fff" stroke="#D5DEE8"/>
    <rect x="48" y="360" width="6" height="150" rx="3" fill="#FF3621"/>
    <text x="70" y="388" class="h">Databricks</text>
    <text x="70" y="414" class="b">- SQL Warehouse</text>
    <text x="70" y="434" class="b">- Unity Catalog tables</text>
    <text x="70" y="454" class="b">- User auth scope: sql</text>
    <text x="70" y="486" class="t">Identity U (user token)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="340" width="250" height="170" rx="12" fill="#fff" stroke="#D5DEE8"/>
    <rect x="650" y="340" width="6" height="170" rx="3" fill="#0078D4"/>
    <text x="672" y="368" class="h">Azure AI Foundry</text>
    <text x="672" y="394" class="b">- Azure OpenAI deployments</text>
    <text x="672" y="414" class="b">- EDIM_FOUNDRY_* (not AZURE_CLIENT_*)</text>
    <text x="672" y="434" class="b">- Local: az login if unset</text>
    <text x="672" y="486" class="t">Identity B (Foundry SP)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="980" y="360" width="252" height="150" rx="12" fill="#fff" stroke="#D5DEE8"/>
    <rect x="980" y="360" width="6" height="150" rx="3" fill="#334155"/>
    <text x="1002" y="388" class="h">LangSmith</text>
    <text x="1002" y="414" class="b">- Projects: SDBX / DEV / PROD</text>
    <text x="1002" y="434" class="b">- Traces / tokens / debug</text>
    <text x="1002" y="454" class="b">- Eval / golden sets later</text>
    <text x="1002" y="486" class="t">Observability</text>
  </g>

  <line x1="258" y1="185" x2="330" y2="185" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="176" class="lbl">HTTPS</text>
  <line x1="580" y1="185" x2="650" y2="185" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="595" y="176" class="lbl">invoke</text>
  <line x1="455" y1="270" x2="455" y2="340" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="785" y1="270" x2="785" y2="340" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="185" x2="980" y2="185" stroke="#64748B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="330" y1="425" x2="258" y2="425" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="416" class="lbl">SQL (U)</text>
  <line x1="580" y1="425" x2="650" y2="425" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="595" y="416" class="lbl">LLM (B)</text>
  <path d="M900 200 C 940 240, 960 300, 980 380" fill="none" stroke="#64748B" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <line x1="48" y1="560" x2="1232" y2="560" stroke="#D5DEE8" stroke-width="1"/>
  <text x="48" y="590" class="foot">U = user SQL token · A = App SP opens Key Vault · B = Foundry SP in EDIM_FOUNDRY_* · Solid = data · Dashed = secrets/obs</text>
  <text x="48" y="680" class="foot">EDIM DDE · R1 · refreshed 2026-08-08 (Apps identities) · Import into PowerPoint as SVG</text>
  <text x="1100" y="680" class="foot">Slide asset</text>
</svg>
