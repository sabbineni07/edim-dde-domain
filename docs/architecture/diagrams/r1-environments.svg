<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="EDIM DDE R1 environments">
  <defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="55%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#FF3621"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #F7F9FC; }
      .title { font: 700 26px 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0A1628; }
      .sub { font: 400 13px 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5C6B7A; }
      .h { font: 700 16px 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .b { font: 400 13px 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #334155; }
      .mono { font: 500 12px 'IBM Plex Mono', ui-monospace, monospace; fill: #0A1628; }
      .note { font: 600 12px 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5C6B7A; }
      .foot { font: 400 11px 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5C6B7A; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="6" fill="url(#topbar)"/>
  <text x="48" y="44" class="title">EDIM DDE R1 - Environments (Phase 0 focus)</text>
  <text x="48" y="68" class="sub">Full set: SDBX / DEV / UAT / INTG / PROD - Phase 0 implements SDBX, DEV, PROD</text>

  <g filter="url(#shadow)">
    <rect x="48" y="100" width="370" height="460" rx="14" fill="#fff" stroke="#D5DEE8"/>
    <rect x="48" y="100" width="370" height="48" rx="14" fill="#2563EB"/>
    <rect x="48" y="132" width="370" height="16" fill="#2563EB"/>
    <text x="68" y="130" class="h">SDBX - Sandbox</text>
    <text x="68" y="182" class="b">Purpose: spikes, LangSmith learning</text>
    <text x="68" y="206" class="b">Databricks: sandbox workspace</text>
    <text x="68" y="230" class="b">Foundry: non-prod deployment</text>
    <text x="68" y="254" class="b">Tracing: verbose OK</text>
    <text x="68" y="278" class="b">Agents: experimental YAML OK</text>
    <text x="68" y="302" class="b">Data: synthetic / sample UC</text>
    <rect x="68" y="330" width="330" height="120" rx="10" fill="#EFF6FF"/>
    <text x="84" y="358" class="mono">EDIM_ENV=sdbx</text>
    <text x="84" y="380" class="mono">LANGCHAIN_PROJECT=edim-dde-sdbx</text>
    <text x="84" y="402" class="mono">App: edim-dde-api-sdbx (opt)</text>
    <text x="84" y="424" class="mono">KV: edim-dde-sdbx-kv</text>
    <text x="68" y="480" class="note">Promote to DEV</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="100" width="370" height="460" rx="14" fill="#fff" stroke="#D5DEE8"/>
    <rect x="455" y="100" width="370" height="48" rx="14" fill="#0D9488"/>
    <rect x="455" y="132" width="370" height="16" fill="#0D9488"/>
    <text x="475" y="130" class="h">DEV - Development</text>
    <text x="475" y="182" class="b">Purpose: active feature work</text>
    <text x="475" y="206" class="b">Databricks: shared DEV WS</text>
    <text x="475" y="230" class="b">Foundry: DEV deployment</text>
    <text x="475" y="254" class="b">Tracing: on</text>
    <text x="475" y="278" class="b">Agents: R1 reference agents</text>
    <text x="475" y="302" class="b">CI: validate YAML + unit tests</text>
    <rect x="475" y="330" width="330" height="120" rx="10" fill="#ECFDF5"/>
    <text x="491" y="358" class="mono">EDIM_ENV=dev</text>
    <text x="491" y="380" class="mono">LANGCHAIN_PROJECT=edim-dde-dev</text>
    <text x="491" y="402" class="mono">App: edim-dde-api-dev</text>
    <text x="491" y="424" class="mono">KV: edim-dde-dev-kv</text>
    <text x="475" y="480" class="note">Promote to PROD (UAT/INTG later)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="862" y="100" width="370" height="460" rx="14" fill="#fff" stroke="#D5DEE8"/>
    <rect x="862" y="100" width="370" height="48" rx="14" fill="#B91C1C"/>
    <rect x="862" y="132" width="370" height="16" fill="#B91C1C"/>
    <text x="882" y="130" class="h">PROD - Production</text>
    <text x="882" y="182" class="b">Purpose: live Apps traffic</text>
    <text x="882" y="206" class="b">Databricks: production workspace</text>
    <text x="882" y="230" class="b">Foundry: prod deployment</text>
    <text x="882" y="254" class="b">Tracing: on + PII redaction</text>
    <text x="882" y="278" class="b">Agents: approved versions only</text>
    <text x="882" y="302" class="b">EDIM_FOUNDRY_* from Key Vault</text>
    <rect x="882" y="330" width="330" height="120" rx="10" fill="#FEF2F2"/>
    <text x="898" y="358" class="mono">EDIM_ENV=prod</text>
    <text x="898" y="380" class="mono">LANGCHAIN_PROJECT=edim-dde-prod</text>
    <text x="898" y="402" class="mono">App: edim-dde-api-prod</text>
    <text x="898" y="424" class="mono">KV: edim-dde-prod-kv</text>
    <text x="882" y="480" class="note">Change control + rollback playbooks</text>
  </g>

  <text x="48" y="600" class="b">Deferred in Phase 0 (documented for later): UAT (user acceptance) / INTG (integration)</text>
  <text x="48" y="630" class="sub">Apps: edim-dde-api-* (+ future edim-dde-ui-*) · one LangSmith project + KV per env · never share PROD secrets</text>
  <text x="48" y="690" class="foot">EDIM DDE · R1 · refreshed 2026-08-08 · Import SVG into PowerPoint</text>
</svg>
